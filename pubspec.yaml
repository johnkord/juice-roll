name: juice_roll
description: A Flutter iOS app that emulates the Juice Oracle dice mechanics.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/abstract_icons/
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/RobotoMono-OFL.txt
    - assets/fonts/Noto-OFL.txt

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Variable.ttf
    - family: JuiceSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.otf
    - family: JuiceSymbolsExtended
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.otf
